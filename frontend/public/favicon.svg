<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Plate Base with warm paper background and vibrant green border -->
  <circle cx="32" cy="32" r="30" fill="#F6F8F2" stroke="#2E7D46" stroke-width="3.5"/>
  
  <!-- Subtle plate rim dash matching UI dropzone -->
  <circle cx="32" cy="32" r="24.5" stroke="#17201A" stroke-width="1" stroke-dasharray="2 3" opacity="0.3"/>

  <!-- Three Macro Balance Arcs matching the nutrition label bars -->
  <!-- Protein (Leaf Green #2E7D46) -->
  <circle cx="32" cy="32" r="19.5" stroke="#2E7D46" stroke-width="3" stroke-dasharray="32 100" stroke-linecap="round" transform="rotate(-100 32 32)"/>
  <!-- Carbs (Grain Gold #D9A23B) -->
  <circle cx="32" cy="32" r="19.5" stroke="#D9A23B" stroke-width="3" stroke-dasharray="24 100" stroke-linecap="round" transform="rotate(30 32 32)"/>
  <!-- Fat (Beet Berry #8E3B5E) -->
  <circle cx="32" cy="32" r="19.5" stroke="#8E3B5E" stroke-width="3" stroke-dasharray="16 100" stroke-linecap="round" transform="rotate(130 32 32)"/>

  <!-- Elegant Botanical Leaf in Center -->
  <path d="M32 15 C42.5 22 43 35 32 45 C21 35 21.5 22 32 15 Z" fill="#2E7D46"/>
  <!-- Central Leaf Vein -->
  <path d="M32 43 L32 21" stroke="#F6F8F2" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Side Veins -->
  <path d="M32 35 L36.5 30" stroke="#F6F8F2" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 31 L27.5 26" stroke="#F6F8F2" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Nutrition Sparkle / Grain Accent -->
  <circle cx="40.5" cy="18.5" r="2.5" fill="#D9A23B"/>
</svg>
